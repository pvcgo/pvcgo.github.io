<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://pvcgo.github.io/favicon.ico?v=2" type="image/x-icon"/>
    <link rel="stylesheet" href="index_files/style.css?v=dev37"/>
    <title>PVC APP</title>
    <script src="index_files/js/button.js?v=dev36"></script>
</head>

<body>

    <div style="position:fixed;top:0px;left:0px;width:100%;z-index:101;">
        <div class="TableA" style="text-align:left;background:#0abf58;color:white;border:0px;border-radius:0px;padding:10px;font-family:Arial;">
            APP MENU
        </div>
    </div>

    <center>
        <div class="favorite-menu" id="favoriteMenu"></div>
    </center>

    <div class="container">

        <div class="pannel">
            <div class="pannel-grid" id="pannel1"></div>
        </div>

        <div class="pannel">
            <div class="pannel-grid" id="pannel2"></div>
        </div>

        <div class="pannel">
            <div class="pannel-grid" id="pannel3"></div>
        </div>

        <div class="pannel">
            <div class="pannel-grid" id="pannel4"></div>
        </div>

        <div class="pannel">
            <div class="pannel-grid" id="pannel5"></div>
        </div>

        <div class="pannel">
            <div class="pannel-grid" id="pannel6"></div>
        </div>
    </div>
    <br>
    <span style="color:rgba(255,255,255,0.8);">@PVC Menu</span>
<script>
const MENU_CONFIG =
{
    storageKey: 'PVC_MENU_DATA',
    cacheVersion: 1,
    panelCount: 6
};
var DSButton = [];
var dsPannel =
[
    {
        caption: 'Công cụ tổng quát hay dùng',
        element: null
    },
    {
        caption: 'Công cụ Design',
        element: null
    },
    {
        caption: 'PVC APP',
        element: null
    },
    {
        caption: 'Công cụ lập trình web/App',
        element: null
    },
    {
        caption: 'APP handmade',
        element: null
    },
    {
        caption: 'Menu khác',
        element: null
    }
];


function initPanels()
{
    for (let i = 0; i < dsPannel.length; i++)
    {
        const stt = i + 1;
        const element = document.getElementById(
            'pannel' + stt
        );
        dsPannel[i].element = element;
        element.innerHTML = '';
        const caption = document.createElement('div');
        caption.className = 'pannel__caption';
        caption.innerText = dsPannel[i].caption;
        element.appendChild(caption);
    }
}


function createDSButton(data)
{
    DSButton = [];

    for (let i = 0; i < data.length; i++)
    {
        const item = data[i];

        const button = new MenuButton(
            Number(item.pannelStt),
            String(item.id || ''),
            String(item.link || ''),
            String(item.text || ''),
            String(item.imageSrc || ''),
            String(item.imageWidth || ''),
            String(item.imageHeight || '')
        );

        DSButton.push(button);
    }
}


function renderMenu(data)
{
    createDSButton(data);
    initPanels();
    for (let i = 0; i < DSButton.length; i++)
    {
        const button = DSButton[i];
        const panelIndex = button.pannelStt - 1;
        if (
            panelIndex < 0 ||
            panelIndex >= dsPannel.length
        )
        {
            console.warn(
                'Panel không hợp lệ:',
                button
            );
            continue;
        }
        dsPannel[panelIndex]
            .element
            .appendChild(
                button.toElement()
            );
    }

    renderFavoriteButtons();
}


function loadLocalMenu()
{
    try
    {
        const raw = localStorage.getItem(
            MENU_CONFIG.storageKey
        );

        if (!raw)
        {
            return null;
        }

        const cache = JSON.parse(raw);

        if (
            cache.cacheVersion !==
            MENU_CONFIG.cacheVersion
        )
        {
            localStorage.removeItem(
                MENU_CONFIG.storageKey
            );

            return null;
        }

        if (!Array.isArray(cache.data))
        {
            return null;
        }

        return cache;
    }
    catch (error)
    {
        console.warn(
            'Lỗi localStorage:',
            error
        );

        localStorage.removeItem(
            MENU_CONFIG.storageKey
        );

        return null;
    }
}


function saveLocalMenu(version, data)
{
    const cache =
    {
        cacheVersion: MENU_CONFIG.cacheVersion,
        version: String(version),
        data: data,
        savedAt: Date.now()
    };

    try
    {
        localStorage.setItem(
            MENU_CONFIG.storageKey,
            JSON.stringify(cache)
        );

        return true;
    }
    catch (error)
    {
        console.warn(
            'Không thể lưu cache:',
            error
        );

        return false;
    }
}


function checkServerVersion(localCache)
{
    google.script.run
        .withSuccessHandler(function(serverVersion)
        {
            serverVersion = String(serverVersion);

            if (
                serverVersion ===
                String(localCache.version)
            )
            {
                console.log(
                    'PVC MENU: localStorage đã mới nhất'
                );

                return;
            }

            console.log(
                'PVC MENU: phát hiện version mới:',
                serverVersion
            );

            loadMenuFromServer();
        })
        .withFailureHandler(function(error)
        {
            console.warn(
                'Không kiểm tra được version:',
                error
            );
        })
        .getMenuVersion();
}


function loadMenuFromServer()
{
    google.script.run
        .withSuccessHandler(function(result)
        {
            if (!result)
            {
                console.warn(
                    'Server không trả dữ liệu'
                );

                return;
            }

            if (!Array.isArray(result.data))
            {
                console.warn(
                    'Dữ liệu server không hợp lệ'
                );

                return;
            }

            saveLocalMenu(
                result.version,
                result.data
            );

            renderMenu(
                result.data
            );

            console.log(
                'PVC MENU: đã cập nhật version',
                result.version
            );
        })
        .withFailureHandler(function(error)
        {
            console.error(
                'Không tải được Menu:',
                error
            );
        })
        .getMenuData();
}


function startupMenu()
{
    initPanels();

    const localCache = loadLocalMenu();

    if (localCache)
    {
        renderMenu(
            localCache.data
        );

        console.log(
            'PVC MENU: render localStorage',
            localCache.version
        );

        checkServerVersion(
            localCache
        );

        return;
    }

    console.log(
        'PVC MENU: không có localStorage'
    );

    loadMenuFromServer();
}


document.addEventListener(
    'DOMContentLoaded',
    startupMenu
);

</script>

</body>
